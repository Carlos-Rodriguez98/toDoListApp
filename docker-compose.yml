version: '3.9'
services:
  todolistapp-database:
    image: postgres:15
    container_name: todolistapp-database
    restart: always
    env_file:
      - ./database/.env
    ports:
      - "5432:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices

  auth-service:
    build: ./authService
    container_name: auth-service
    restart: always
    env_file:
      - ./authService/.env
    depends_on:
      - todolistapp-database
    ports:
      - "8080:8080"
    volumes:
      - ./authService/static:/app/static
    networks:
      - microservices

  category-service:
    build: ./categoryService
    container_name: category-service
    restart: always
    env_file:
      - ./categoryService/.env
    depends_on:
      - todolistapp-database
    ports:
      - "8081:8080"
    networks:
      - microservices

  task-service:
    build: ./taskService
    container_name: task-service
    depends_on:
      - todolistapp-database
    env_file:
      - ./taskService/.env
    ports:
      - "8082:8080"
    networks:
      - microservices

  frontend-service:
    build: ./frontend
    container_name: frontend-service
    restart: always
    ports:
      - "8083:80" # afuera 8083 -> adentro 80 (nginx)
    networks:
      - microservices

volumes:
  user_data:

networks:
  microservices:
    driver: bridge
    