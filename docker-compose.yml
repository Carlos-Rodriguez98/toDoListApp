version: '3.9'
services:
  userDatabase:
    image: postgres:16
    container_name: userDatabase
    restart: always
    environment:
      - POSTGRES_USER: Admin
        POSTGRES_PASSWORD: Admin
        POSTGRES_DB: userAuth
    ports:
      - "5432:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - microservices

volumes:
  user_data:

networks:
  microservices:
    driver: bridge
    