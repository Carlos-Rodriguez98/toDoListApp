<!DOCTYPE html>
<html lang="e">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="categories/category.css">
    <link rel="stylesheet" href="tasks/task.css">
</head>
<body>

    <!-- Login View -->

    <section id="view-login">

        <header id="header-login">
            <h1>TO DO LIST APP</h1>
        </header>

        <main id="main-login">
            <h2>Sign In</h2>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">

            <div id="buttons">
                <button id="btn-login">Enter</button>
                <button id="btn-register">Register</button>
            </div>
        </main>

    </section>

    <!-- Dashboard View -->
     
    <section id="view-dashboard">

        <header id="header-dashboard">
            <h1>TO DO LIST APP</h1>
            <div id="user-info">
                <div id="user-name">
                    <span id="username-span"></span>
                    <a href="#" id="btn-logout">Log out</a>
                </div>
                <img id="user-avatar" src="" alt="User Avatar">
            </div>
        </header>

        <main id="main-dashboard">
            <div id="categories"></div>
            <div id="tasks"></div>
        </main>

    </section>

    <script src="script.js"></script>
    <script src="categories/category.js"></script>
    <script src="tasks/task.js"></script>
</body>
</html>
