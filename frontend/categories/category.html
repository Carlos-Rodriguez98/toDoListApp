<h2>Categories</h2>
<button id="add-category">+</button>
<div id="category-list"></div>

<div id="modal-category-overlay">
    <div id="modal-category-content">

        <span id="modal-category-close">&times;</span>
        <h2>New Category</h2>

        <label for="category-name">Name</label>
        <input type="text" id="category-name" placeholder="Category name">

        <label for="category-description">Description</label>
        <textarea id="category-description" placeholder="Category description" rows="3"></textarea>

        <button id="save-category">Save</button>
        
    </div>
</div>

<div id="modal-delete-overlay">
  <div id="modal-delete-content">
    <span id="modal-delete-close">&times;</span>
    <h2>Delete Category</h2>
    <p>Are you sure you want to delete this category? This action cannot be undone.</p>
    
    <div class="modal-delete-buttons">
      <button id="confirm-delete">Delete</button>
      <button id="cancel-delete">Cancel</button>
    </div>
  </div>
</div>
